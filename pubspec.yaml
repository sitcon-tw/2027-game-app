name: sitcon_app
description: "SITCON player app with offline and connected testing."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  sitcon_backend:
    path: packages/sitcon_backend
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  nfc_manager: ^4.4.0
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  path_provider: ^2.1.6
  # The Android durability barrier uses the plugin's preference file names.
  flutter_secure_storage: 10.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  generate: true

  uses-material-design: true

